# ============================================================================
# Task 2: Ingress — host + path based routing, TLS termination via
# cert-manager (ClusterIssuer assumed pre-provisioned).
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - hosts: ["api.acme.example.com"]
      secretName: app-tls-cert
  rules:
    - host: api.acme.example.com
      http:
        paths:
          - path: /api/v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: service-a, port: { number: 80 } }
          - path: /api/v2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: service-b, port: { number: 80 } }
