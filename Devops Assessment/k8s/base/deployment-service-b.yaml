# ============================================================================
# Task 2: Deployment for Service B (mirrors service-a's hardening/HA rules,
# talks to MySQL instead of Postgres to exercise the multi-engine requirement)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: app
  labels:
    app: service-b
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [service-b]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: service-b
          image: ghcr.io/acme/service-b:__IMAGE_TAG__
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: DB_HOST
              value: mysql.data.svc.cluster.local
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: mysql-app-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-app-credentials, key: password }
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet: { path: /healthz/ready, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz/live, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: app
spec:
  selector:
    app: service-b
  ports:
    - port: 80
      targetPort: 8081
      name: http
