# ============================================================================
# Task 5: Production overlay
# - Full replica counts inherited from base
# - Production HPA maxReplicas
# - Git commit SHA image tags injected by CI
# - Production hostname/configuration inherited from base
# ============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: service-a-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind: HorizontalPodAutoscaler
      name: service-b-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20

images:
  - name: ghcr.io/shabbiralam1999/service-a
    newTag: __GIT_SHA__

  - name: ghcr.io/shabbiralam1999/service-b
    newTag: __GIT_SHA__
