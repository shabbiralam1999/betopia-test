# ============================================================================
# Task 4: Prometheus alerting rules (loaded via PrometheusRule CR, assumes
# kube-prometheus-stack is installed by scripts/bootstrap.sh).
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-alert-rules
  namespace: observability
  labels:
    release: kube-prometheus-stack   # required for the operator to pick it up
spec:
  groups:
    - name: http-errors
      rules:
        - alert: HighHTTP5xxRate
          expr: |
            (
              sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
              /
              sum(rate(http_requests_total[5m])) by (service)
            ) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.service }} 5xx rate above 5%"
            description: "{{ $labels.service }} has returned >5% HTTP 5xx responses for the last 5 minutes."

    - name: storage
      rules:
        - alert: DatabasePVCNearFull
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="data"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="data"}
            ) * 100 > 85
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is over 85% full"
            description: "Database PVC in namespace data is at {{ $value | printf \"%.1f\" }}% capacity. Expand the volume or trigger cleanup before it fills."

    - name: pod-health
      rules:
        - alert: PodCrashLoopBackOff
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"app|data"}[10m]) > 3
            and
            kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) has restarted repeatedly and is in CrashLoopBackOff."
